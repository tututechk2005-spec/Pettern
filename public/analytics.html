<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Analytics | AI Trader</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="app-shell" id="app-shell"><div id="page-content">
  <div class="page-header animate-in"><div class="page-title">Analytics</div><div class="page-sub">Performance by symbol and mode</div></div>
  <div class="grid-2 animate-in mb-16">
    <div class="card"><div class="fw-700 mb-16">By Symbol</div><div class="table-wrap" id="by-symbol"><div class="empty-state">No data yet.</div></div></div>
    <div class="card"><div class="fw-700 mb-16">Manual vs Auto</div><div class="table-wrap" id="by-source"><div class="empty-state">No data yet.</div></div></div>
  </div>
  <div class="card animate-in">
    <div class="fw-700 mb-16">Equity Curve</div>
    <canvas id="cv" height="80" style="width:100%;display:block;"></canvas>
  </div>
</div></div>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/layout.js"></script>
<script>
function drawCurve(pts){
  const cv=document.getElementById('cv');
  const ctx=cv.getContext('2d');
  cv.width=cv.clientWidth||600;
  const h=cv.height,w=cv.width;
  ctx.clearRect(0,0,w,h);
  if(!pts.length){ctx.fillStyle='var(--text-3)';ctx.textAlign='center';ctx.fillText('No data',w/2,h/2);return;}
  const vals=pts.map(p=>p.equity);
  const mn=Math.min(...vals,0),mx=Math.max(...vals,0),rng=mx-mn||1;
  const pos=pts[pts.length-1].equity>=0;
  ctx.beginPath();
  pts.forEach((p,i)=>{
    const x=(i/(pts.length-1||1))*w;
    const y=h-((p.equity-mn)/rng)*h*0.85-h*0.07;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.strokeStyle=pos?'#0ecb81':'#f6465d'; ctx.lineWidth=1.5; ctx.stroke();
}
async function load(){
  const d=await Api.get('/api/analytics');
  const bs=document.getElementById('by-symbol');
  const ent=Object.entries(d.bySymbol);
  bs.innerHTML=ent.length?`<table><thead><tr><th>Symbol</th><th>Trades</th><th>Win%</th><th>PNL</th></tr></thead><tbody>
    ${ent.map(([s,v])=>`<tr><td class="fw-600">${s}</td><td>${v.trades}</td><td>${((v.wins/v.trades)*100).toFixed(0)}%</td><td class="${v.pnl>=0?'pos':'neg'}">$${v.pnl.toFixed(2)}</td></tr>`).join('')}
  </tbody></table>`:'<div class="empty-state">No data yet.</div>';
  const src=document.getElementById('by-source');
  src.innerHTML=`<table><thead><tr><th>Mode</th><th>Trades</th><th>PNL</th></tr></thead><tbody>
    ${Object.entries(d.bySource).map(([m,v])=>`<tr><td style="text-transform:capitalize">${m}</td><td>${v.trades}</td><td class="${v.pnl>=0?'pos':'neg'}">$${v.pnl.toFixed(2)}</td></tr>`).join('')}
  </tbody></table>`;
  drawCurve(d.equityCurve);
}
load();
</script>
</body></html>

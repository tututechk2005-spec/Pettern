<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Reset Password | AI Trader</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card animate-in">
    <div class="card">
      <h2 class="auth-title">Set new password</h2>
      <p class="auth-sub">Choose a strong password for your account</p>
      <div id="alert-box"></div>
      <form id="form">
        <div class="field"><label>New Password</label><input type="password" name="password" required minlength="8" placeholder="At least 8 characters"/></div>
        <button class="btn btn-primary btn-block" type="submit" id="btn">Update Password</button>
      </form>
      <div class="auth-footer"><a href="/login.html" style="color:var(--yellow);">← Back to log in</a></div>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
const token = new URLSearchParams(window.location.search).get('token');
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const box = document.getElementById('alert-box');
  box.innerHTML = '';
  if (!token) { box.innerHTML='<div class="alert alert-error">Missing or invalid reset link.</div>'; return; }
  btn.disabled = true; btn.textContent = 'Updating…';
  try {
    await Api.post('/api/auth/reset-password', { token, password: new FormData(e.target).get('password') });
    box.innerHTML = '<div class="alert alert-success">Password updated! Redirecting…</div>';
    setTimeout(() => window.location.href = '/login.html', 1500);
  } catch (err) {
    box.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    btn.disabled = false; btn.textContent = 'Update Password';
  }
});
</script>
</body>
</html>

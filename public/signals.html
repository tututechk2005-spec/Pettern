<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Signals | AI Trader</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="app-shell" id="app-shell"><div id="page-content">
  <div class="page-header animate-in"><div class="page-title">AI Signals</div><div class="page-sub">Every signal the engine generated — refresh every 10s</div></div>
  <div class="card animate-in"><div class="table-wrap" id="tbl"><div class="empty-state">No signals yet.</div></div></div>
</div></div>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/layout.js"></script>
<script>
async function load(){
  const {signals}=await Api.get('/api/signals');
  const tbl=document.getElementById('tbl');
  tbl.innerHTML=signals.length?`<table><thead><tr><th>Time</th><th>Symbol</th><th>Dir</th><th>Conf</th><th>Trend</th><th>Vol</th><th>Mom</th><th>R:R</th><th>Status</th></tr></thead><tbody>
    ${signals.map(s=>`<tr>
      <td class="text-xs text-3 nowrap">${new Date(s.created_at*1000).toLocaleTimeString()}</td>
      <td class="fw-700">${s.symbol}</td>
      <td>${s.direction==='long'?'<span class="badge badge-green">L</span>':'<span class="badge badge-red">S</span>'}</td>
      <td class="${s.confidence>=95?'pos fw-600':'text-1'}">${s.confidence}%</td>
      <td>${s.trend_confirmed?'✅':'—'}</td><td>${s.volume_confirmed?'✅':'—'}</td><td>${s.momentum_confirmed?'✅':'—'}</td>
      <td class="text-2">1:${(s.risk_reward||0).toFixed(1)}</td>
      <td><span class="badge badge-gray">${s.status}</span></td>
    </tr>`).join('')}
  </tbody></table>`:'<div class="empty-state">No signals yet.</div>';
}
load(); setInterval(load,10000);
</script>
</body></html>

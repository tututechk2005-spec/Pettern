<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Forgot Password | AI Trader</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card animate-in">
    <div class="card">
      <h2 class="auth-title">Reset password</h2>
      <p class="auth-sub">Enter your email and we'll send a reset link</p>
      <div id="alert-box"></div>
      <form id="form">
        <div class="field"><label>Email Address</label><input type="email" name="email" required placeholder="you@example.com"/></div>
        <button class="btn btn-primary btn-block" type="submit" id="btn">Send Reset Link</button>
      </form>
      <div class="auth-footer"><a href="/login.html" style="color:var(--yellow);">← Back to log in</a></div>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const box = document.getElementById('alert-box');
  box.innerHTML = ''; btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const d = await Api.post('/api/auth/forgot-password', { email: new FormData(e.target).get('email') });
    let h = `<div class="alert alert-success">${d.message}</div>`;
    if (d.devResetLink) h += `<div class="alert alert-info">Dev link: <a href="${d.devResetLink}" style="color:inherit;text-decoration:underline;word-break:break-all;">${d.devResetLink}</a></div>`;
    box.innerHTML = h; btn.textContent = 'Sent';
  } catch (err) {
    box.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    btn.disabled = false; btn.textContent = 'Send Reset Link';
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Trade History | AI Trader</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="app-shell" id="app-shell"><div id="page-content">
  <div class="page-header animate-in"><div class="page-title">Trade History</div><div class="page-sub">Every closed trade</div></div>
  <div class="card animate-in">
    <div class="table-wrap" id="tbl"><div class="empty-state">No trades yet.</div></div>
    <div class="flex items-center justify-between mt-16">
      <button class="btn btn-ghost btn-sm" id="prev-btn">← Prev</button>
      <span class="text-sm text-2" id="pg"></span>
      <button class="btn btn-ghost btn-sm" id="next-btn">Next →</button>
    </div>
  </div>
</div></div>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/layout.js"></script>
<script>
let pg=1;
async function load(){
  const d=await Api.get('/api/history?page='+pg);
  document.getElementById('pg').textContent=`Page ${d.page} of ${Math.max(1,Math.ceil(d.total/d.pageSize))}`;
  document.getElementById('tbl').innerHTML=d.trades.length?`<table><thead><tr><th>Date</th><th>Symbol</th><th>Side</th><th>Entry</th><th>Exit</th><th>PNL</th><th>Result</th><th>Src</th></tr></thead><tbody>
    ${d.trades.map(t=>`<tr>
      <td class="text-xs text-3 nowrap">${new Date(t.closed_at*1000).toLocaleDateString()}</td>
      <td class="fw-600">${t.symbol}</td>
      <td>${t.side==='long'?'<span class="badge badge-green">L</span>':'<span class="badge badge-red">S</span>'}</td>
      <td class="text-2">${t.entry_price}</td><td class="text-2">${t.exit_price}</td>
      <td class="${t.pnl>=0?'pos':'neg'} fw-600">$${Number(t.pnl).toFixed(2)}</td>
      <td><span class="badge ${t.result==='win'?'badge-green':'badge-red'}">${t.result}</span></td>
      <td><span class="badge ${t.source==='auto'?'badge-blue':'badge-gray'}">${t.source}</span></td>
    </tr>`).join('')}
  </tbody></table>`:'<div class="empty-state">No trades yet.</div>';
}
document.getElementById('prev-btn').onclick=()=>{if(pg>1){pg--;load();}};
document.getElementById('next-btn').onclick=()=>{pg++;load();};
load();
</script>
</body></html>

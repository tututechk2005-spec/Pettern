<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Support | AI Trader</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="app-shell" id="app-shell"><div id="page-content">
  <div class="page-header animate-in"><div class="page-title">Support</div><div class="page-sub">Open a ticket — our team responds here</div></div>
  <div class="grid-2 animate-in">
    <div class="card">
      <div class="fw-700 mb-16">New Ticket</div>
      <div id="tk-alert"></div>
      <form id="tk-form">
        <div class="field"><label>Subject</label><input type="text" name="subject" required/></div>
        <div class="field"><label>Message</label><textarea name="message" required></textarea></div>
        <button class="btn btn-primary btn-block" type="submit">Submit Ticket</button>
      </form>
    </div>
    <div class="card">
      <div class="fw-700 mb-16">Your Tickets</div>
      <div id="tk-list"><div class="empty-state">No tickets yet.</div></div>
    </div>
  </div>
</div></div>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/layout.js"></script>
<script>
async function loadTickets(){
  const {tickets}=await Api.get('/api/support');
  document.getElementById('tk-list').innerHTML=tickets.length?tickets.map(t=>`
    <div style="padding:12px 0;border-bottom:1px solid var(--border);">
      <div class="flex justify-between items-center">
        <div class="fw-600 text-sm">${t.subject}</div>
        <span class="badge ${t.status==='open'?'badge-yellow':'badge-green'}">${t.status}</span>
      </div>
      <div class="text-2 text-xs mt-4" style="line-height:1.6;">${t.message}</div>
      ${t.reply?`<div class="text-xs mt-8 text-yellow"><strong>Support:</strong> ${t.reply}</div>`:''}
    </div>`).join(''):'<div class="empty-state">No tickets yet.</div>';
}
document.getElementById('tk-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const box=document.getElementById('tk-alert'); box.innerHTML='';
  const f=new FormData(e.target);
  try{ await Api.post('/api/support',{subject:f.get('subject'),message:f.get('message')});
    box.innerHTML='<div class="alert alert-success">Ticket submitted.</div>'; e.target.reset(); loadTickets();
  }catch(err){ box.innerHTML=`<div class="alert alert-error">${err.message}</div>`; }
});
loadTickets();
</script>
</body></html>
